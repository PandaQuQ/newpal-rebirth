# talk:<script>:<pos> keys of the opening script 104; the 3rd and later lines are left untranslated on purpose
"talk:104:0024" = "<speaker>Test Speaker</speaker><color=5>[en sample] This line comes from the sample English pack. It is long enough to show word wrapping: the renderer has to break it at spaces instead of cutting a word in half.</color>"
"talk:104:007e" = "<speaker>Test Speaker B</speaker><color=5>[en sample] Second translated line.<br/>It has a hard line break.</color>"

