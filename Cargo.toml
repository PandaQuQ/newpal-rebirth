[workspace]
resolver = "2"
members = ["crates/newpal-assets", "crates/newpal-vm", "crates/newpal-prepare", "crates/newpal-game"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
encoding_rs = "0.8"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2