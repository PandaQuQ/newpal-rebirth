# Original-style dialogue box (New PAL), redrawn as vectors. Reference space: 640x480 (the original screen);
# scaled by window height, centred horizontally. Values are measured from the player's own UI images at
# runtime-analysis time (see docs/original-ui.md); nothing from the game is stored here.
# Mods can replace this file with `ui/dialogue.toml`.

style = "parchment"
# box: bottom of the screen, full width minus margins (the original anchors a text-sized box near the speaker;
# that placement is not reproduced yet)
rect = [28.0, 350.0, 584.0, 118.0]
pad = [26.0, 16.0, 26.0, 10.0]
# CJK cell 22 px (half-width cell 11 px in the exe): 20 px glyph + 2 px gap, 22 px lines
font_px = 20.0
char_gap = 2.0
line_h = 22.0
lines_per_page = 3
name_line = true
name_color = 6
body_color = 0
palette = [
  [52, 30, 16, 255],    # 0 body: dark brown ink
  [118, 106, 92, 255],  # 1 grey
  [196, 32, 20, 255],   # 2 red (menu hover red)
  [44, 116, 48, 255],   # 3 green
  [36, 72, 168, 255],   # 4 blue
  [150, 100, 24, 255],  # 5 ochre
  [150, 44, 26, 255],   # 6 speaker names: red-brown
  [130, 112, 90, 255],  # 7 hint
  [118, 52, 150, 255],  # 8 violet
  [24, 120, 128, 255],  # 9 teal
]
# pale rim around the ink like the original's menu labels; no drop shadow on paper
outline_px = 1.6
outline = [252, 244, 226, 210]
shadow = [0.0, 0.0]
shadow_color = [0, 0, 0, 0]
fill_top = [240, 232, 215, 246]
fill_bottom = [240, 232, 215, 246]
ornaments = true
ornament = [150, 110, 70, 200]
# one character per 35 ms logic tick at the default speed
speed_ms = [0.0, 17.5, 35.0, 52.5, 70.0, 87.5, 105.0, 140.0, 175.0, 210.0]
default_speed = 2
open_s = 0.16
slide = 8.0
more_at = [-22.0, -12.0]
more_color = [150, 44, 26, 255]
