[package]
name = "newpal-ui"
description = "New PAL reborn: vector UI layer (vello), scene stack, input abstraction, settings, launcher + title screens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# GPU-compute 2D vector renderer (paths, gradients, blurs, glyph outlines) on the engine's wgpu 30 device
vello = { version = "0.12", default-features = false, features = ["wgpu"] }
# font parsing / metrics for glyph layout (same version vello uses internally)
skrifa = "0.49"
wgpu = "30"
winit = "0.30"
# gamepads (XInput / Windows.Gaming.Input / evdev / IOKit)
gilrs = "0.11"
serde.workspace = true
toml.workspace = true
